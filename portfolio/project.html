  <!-- Catches typos and missing files so the page can tell you what to fix.
       Keep this above every other script. -->
  <script>
    window.__portfolioErrors = [];
    window.addEventListener("error", function (event) {
      var target = event.target;
      if (target && target !== window && (target.src || target.href)) {
        window.__portfolioErrors.push({ file: target.src || target.href, missing: true });
      } else {
        window.__portfolioErrors.push({ file: event.filename || "", line: event.lineno || 0, message: event.message || "" });
      }
    }, true);
  </script>
